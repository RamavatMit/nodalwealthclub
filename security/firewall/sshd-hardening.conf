# Copy to /etc/ssh/sshd_config.d/99-nodal.conf, then: sudo systemctl reload ssh
# Make sure your key login works in a second session BEFORE reloading.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowAgentForwarding no
AllowUsers deploy
