name: Deploy

# Manual or on push to main once CI passes. Builds on the VPS so no registry
# is needed. Secrets (Settings → Secrets → Actions):
#   VPS_HOST, VPS_USER (deploy), VPS_SSH_KEY (private key for that user),
#   VPS_KNOWN_HOSTS (output of `ssh-keyscan -t ed25519 <host>`)
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Pull, build and restart
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<'EOF'
            set -euo pipefail
            cd /opt/nodal
            git fetch --prune origin main
            git reset --hard origin/main
            docker compose build --pull web
            docker compose up -d --remove-orphans
            docker image prune -f
            sleep 10
            docker compose ps
            curl -fsS -o /dev/null -w "health %{http_code}\n" --resolve "$(grep ^SITE_DOMAIN= .env | cut -d= -f2):443:127.0.0.1" -k "https://$(grep ^SITE_DOMAIN= .env | cut -d= -f2)/api/health"
          EOF
