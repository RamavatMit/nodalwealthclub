# Production stack for the Hostinger KVM VPS. See DEPLOY.md.
# Only Caddy publishes ports. Postgres and Redis live on an internal network
# with no route to the internet and no published ports.

name: nodal

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./security/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./security/caddy/certs:/etc/caddy/certs:ro # Cloudflare origin certificate
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [edge]

  web:
    build: .
    image: nodal-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://nodal_app:${POSTGRES_APP_PASSWORD}@postgres:5432/nodal
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [edge, internal]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nodal
      POSTGRES_USER: nodal_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./security/docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodal_owner -d nodal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - CONFIG
      - ""
    volumes:
      - redis_data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]

  # Phase 2+: `worker` (BullMQ jobs) joins here, built from the same image.

networks:
  edge:
  internal:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  redis_data:
